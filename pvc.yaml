## EBS

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-block
spec:
  volumeMode: Block
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 10Gi
