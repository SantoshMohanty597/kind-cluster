### You can use in env of pod

apiVersion: v1
kind: ConfigMap
metadata:
  name: my-app-config
  namespace: default
data:
  # plain-text key/value pairs
  APP_ENV: "production"
  LOG_LEVEL: "info"
  DB_HOST: "mysql.internal.svc.cluster.local"
  DB_PORT: "3306"
  FEATURE_FLAG_NEW_UI: "true"


  #### use this as volume mount

  
#   env:
#   valueFrom: 
#     configMapRef: 
#       name: app-config
#       key: APP_ENV 

# envFrom: 
#   configMapRef:
#     name: app-config ## this will inject all value


