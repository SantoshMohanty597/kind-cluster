apiVersion: batch/v1
kind: Job
metadata:
  name: db-backup-job
  namespace: operations
  labels:
    app: database-backup
  annotations:
    description: "Performs a one-time database backup and stores it on a persistent volume"
spec:
  completions: 5      ## Pod runs are required for the Job
  parallelism: 2      ## max 2 pod Paralled Compute and 2 doing another and last will do another
  backoffLimit: 3     ## backoffLimit defines how many times Kubernetes will retry a Job after it fails, 
                      ## before marking it as failed permanently.
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app: database-backup
    spec:
      restartPolicy: OnFailure
      containers:
      - name: backup-container
        image: busybox:latest
        command: ["sh", "-c", "echo Starting backup... && echo 'Backup data' > /backup/db-backup.txt && sleep 10 && echo Backup complete!"]

        # command: ["sh", "-c"]
        # args:
        #   - |
        #     echo Starting backup
        #     echo "Backup data" > /backup/db-backup.txt
        #     sleep 10
        #     echo Backup complete

        
        volumeMounts:
        - name: backup-storage
          mountPath: /backup                # Mount path inside container
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

      # Volume Section
      volumes:
      - name: backup-storage
        persistentVolumeClaim:
          claimName: db-backup-pvc          # Reference to existing PVC
