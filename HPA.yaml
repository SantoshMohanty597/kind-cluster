### To use the Autoscaling you need a deployment first. First make deployment then apply Autoscaling
### Learn Bottelneck -cpu , memory 
### Load-gentrater to test the system


# 🔑 RULE #1 (HARD RULE)
# 👉 ONE workload (Deployment / StatefulSet) = ONE HPA
# Kubernetes does NOT allow:
# Multiple HPAs scaling the same Deployment

# ❌ This will conflict
# ❌ One HPA will overwrite the other


# 🔑 RULE #2 (MOST IMPORTANT)
# 👉 ONE HPA can contain MULTIPLE metric TYPES
# You can mix:
# Resource
# Pods
# Object (Ingress / Service)
# External
# ALL inside the SAME HPA YAML



apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deployment   # Target deployment name
  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50   # target CPU utilization %

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

# Requests per pod
# Messages processed per pod
# Errors per pod

# Production usage
# ✔ APIs
# ✔ Microservices
# ✔ High traffic systems
# ✔ Better than CPU scaling
# ➡ Requires Prometheus Adapter
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"

    - type: Object
      object:
        metric:
          name: requests_per_second
        describedObject:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          name: nginx-ingress
        target:
          type: Value
          value: "1000"
          
    - type: External
      external:
        metric:
          name: sqs_queue_depth
        target:
          type: AverageValue
          averageValue: "50"
          




